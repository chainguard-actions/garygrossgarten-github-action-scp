name: Test basic SCP with password auth
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up SSH server with password auth
        run: |
          # Install openssh-server
          apt-get update -qq && apt-get install -y -qq openssh-server

          # Create test user
          useradd -m -s /bin/bash testuser || true
          echo "testuser:testpassword" | chpasswd

          # Configure sshd for password auth
          mkdir -p /var/run/sshd
          cat > /etc/ssh/sshd_config <<'EOF'
          Port 2222
          ListenAddress 0.0.0.0
          HostKey /etc/ssh/ssh_host_rsa_key
          HostKey /etc/ssh/ssh_host_ecdsa_key
          HostKey /etc/ssh/ssh_host_ed25519_key
          PermitRootLogin no
          PubkeyAuthentication yes
          PasswordAuthentication yes
          ChallengeResponseAuthentication no
          UsePAM yes
          PrintMotd no
          AcceptEnv LANG LC_*
          Subsystem sftp /usr/lib/openssh/sftp-server
          StrictModes no
          EOF

          # Generate host keys if missing
          ssh-keygen -A

          # Start sshd on port 2222
          /usr/sbin/sshd -p 2222 -o "StrictModes no"

          # Verify sshd is running
          sleep 2
          ss -tlnp | grep :2222 || netstat -tlnp | grep :2222 || true
          echo "sshd started"

      - name: Create local test directory and files
        run: |
          mkdir -p /tmp/local-test-dir
          echo "hello from scp action test" > /tmp/local-test-dir/hello.txt
          echo "another file" > /tmp/local-test-dir/world.txt

      - name: Create remote destination directory
        run: |
          mkdir -p /home/testuser/remote-dest
          chown testuser:testuser /home/testuser/remote-dest

      - id: scp-action
        uses: .
        with:
          local: /tmp/local-test-dir/
          remote: /home/testuser/remote-dest/
          host: localhost
          port: "2222"
          username: testuser
          password: testpassword
          verbose: true

      - name: Assert files were copied to remote
        run: |
          echo "Checking remote destination..."
          ls -la /home/testuser/remote-dest/
          if [ ! -f "/home/testuser/remote-dest/hello.txt" ]; then
            echo "FAIL: hello.txt not found in remote destination"
            exit 1
          fi
          if [ ! -f "/home/testuser/remote-dest/world.txt" ]; then
            echo "FAIL: world.txt not found in remote destination"
            exit 1
          fi
          CONTENT=$(cat /home/testuser/remote-dest/hello.txt)
          echo "Content: $CONTENT"
          if [ "$CONTENT" != "hello from scp action test" ]; then
            echo "FAIL: file content does not match"
            exit 1
          fi
          echo "PASS: all files copied successfully"
