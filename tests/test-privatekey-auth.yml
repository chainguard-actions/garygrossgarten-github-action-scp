name: Test SCP with private key and passphrase authentication
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up local SSH server with key-based auth
        run: |
          # Install openssh-server
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server

          # Create test user
          sudo useradd -m -s /bin/bash scpkeytest || true

          # Generate a passphrase-protected RSA key pair for the test user
          ssh-keygen -t rsa -b 2048 -f /tmp/test_id_rsa -N "mysecretpassphrase" -q

          # Install the public key for the test user
          sudo mkdir -p /home/scpkeytest/.ssh
          sudo cp /tmp/test_id_rsa.pub /home/scpkeytest/.ssh/authorized_keys
          sudo chown -R scpkeytest:scpkeytest /home/scpkeytest/.ssh
          sudo chmod 700 /home/scpkeytest/.ssh
          sudo chmod 600 /home/scpkeytest/.ssh/authorized_keys

          # Configure sshd
          sudo mkdir -p /var/run/sshd
          sudo ssh-keygen -A

          sudo tee /etc/ssh/sshd_config.d/keytest.conf > /dev/null <<'EOF'
          Port 2223
          PasswordAuthentication no
          PubkeyAuthentication yes
          PermitRootLogin no
          KbdInteractiveAuthentication yes
          ChallengeResponseAuthentication yes
          EOF

          # Start sshd on port 2223
          sudo /usr/sbin/sshd -p 2223

          # Wait for sshd to be ready
          for i in $(seq 1 10); do
            if nc -z localhost 2223 2>/dev/null; then
              echo "SSH server is ready on port 2223"
              break
            fi
            sleep 1
          done

          # Create remote destination directory
          sudo mkdir -p /tmp/scp-key-remote
          sudo chown scpkeytest:scpkeytest /tmp/scp-key-remote

      - name: Create local files to copy
        run: |
          mkdir -p /tmp/scp-key-local
          echo "private key auth test" > /tmp/scp-key-local/keytest.txt

      - name: Add localhost to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 2223 localhost >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Read private key into variable
        id: readkey
        run: |
          PRIVATE_KEY=$(cat /tmp/test_id_rsa)
          echo "private_key<<EOF" >> $GITHUB_OUTPUT
          echo "$PRIVATE_KEY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - id: action
        uses: .
        with:
          local: /tmp/scp-key-local
          remote: /tmp/scp-key-remote
          host: localhost
          username: scpkeytest
          port: "2223"
          privateKey: ${{ steps.readkey.outputs.private_key }}
          passphrase: "mysecretpassphrase"
          tryKeyboard: "false"
          verbose: "true"
          recursive: "true"

      - name: Assert files were copied via private key auth
        run: |
          echo "Checking copied files..."
          if [ ! -f /tmp/scp-key-remote/keytest.txt ]; then
            echo "FAIL: keytest.txt was not copied to remote"
            exit 1
          fi
          CONTENT=$(cat /tmp/scp-key-remote/keytest.txt)
          echo "keytest.txt content: $CONTENT"
          if [ "$CONTENT" != "private key auth test" ]; then
            echo "FAIL: keytest.txt content mismatch"
            exit 1
          fi
          echo "PASS: file copied successfully using private key + passphrase auth"
