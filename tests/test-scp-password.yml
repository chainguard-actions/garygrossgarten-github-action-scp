name: Test SCP with password authentication
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up local SSH server
        run: |
          sudo apt-get install -y openssh-server
          sudo mkdir -p /var/run/sshd
          # Create test user
          sudo useradd -m -s /bin/bash testuser
          echo "testuser:testpassword" | sudo chpasswd
          # Allow password authentication
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          # Start SSH server
          sudo /usr/sbin/sshd -D &
          sleep 2
          # Create remote target directory
          sudo mkdir -p /home/testuser/remote-target
          sudo chown testuser:testuser /home/testuser/remote-target
          # Create local source directory
          mkdir -p /tmp/local-source
          echo "hello from scp test" > /tmp/local-source/test.txt
          echo "another file" > /tmp/local-source/another.txt

      - name: Add localhost to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 localhost >> ~/.ssh/known_hosts

      - id: action
        uses: .
        with:
          local: /tmp/local-source/
          remote: /home/testuser/remote-target/
          host: localhost
          port: "22"
          username: testuser
          password: testpassword
          rmRemote: true
          tryKeyboard: false
          verbose: true
          recursive: true
          concurrency: 1
          atomicPut: false

      - name: Assert files were copied
        run: |
          if [ ! -f /home/testuser/remote-target/test.txt ]; then
            echo "FAIL: test.txt was not copied to remote target"
            exit 1
          fi
          CONTENT=$(cat /home/testuser/remote-target/test.txt)
          echo "actual content: $CONTENT"
          if [ "$CONTENT" != "hello from scp test" ]; then
            echo "FAIL: file content does not match"
            exit 1
          fi
          echo "PASS: files were copied successfully"
