name: Test SCP with tryKeyboard authentication
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up SSH server with keyboard-interactive auth
        run: |
          # Install openssh-server
          apt-get update -qq && apt-get install -y -qq openssh-server

          # Create test user
          useradd -m -s /bin/bash kbuser || true
          echo "kbuser:kbpassword" | chpasswd

          # Configure sshd to allow keyboard-interactive auth
          mkdir -p /var/run/sshd
          cat > /etc/ssh/sshd_config <<'EOF'
          Port 2222
          ListenAddress 0.0.0.0
          HostKey /etc/ssh/ssh_host_rsa_key
          HostKey /etc/ssh/ssh_host_ecdsa_key
          HostKey /etc/ssh/ssh_host_ed25519_key
          PermitRootLogin no
          PubkeyAuthentication yes
          PasswordAuthentication yes
          ChallengeResponseAuthentication yes
          KbdInteractiveAuthentication yes
          UsePAM yes
          PrintMotd no
          AcceptEnv LANG LC_*
          Subsystem sftp /usr/lib/openssh/sftp-server
          StrictModes no
          EOF

          # Generate host keys if missing
          ssh-keygen -A

          # Start sshd on port 2222
          /usr/sbin/sshd -p 2222 -o "StrictModes no"

          # Verify sshd is running
          sleep 2
          ss -tlnp | grep :2222 || true
          echo "sshd started"

      - name: Create local test file
        run: |
          mkdir -p /tmp/kb-test-dir
          echo "keyboard interactive test content" > /tmp/kb-test-dir/kbtest.txt

      - name: Create remote destination directory
        run: |
          mkdir -p /home/kbuser/kb-dest
          chown kbuser:kbuser /home/kbuser/kb-dest

      - id: scp-action
        uses: .
        with:
          local: /tmp/kb-test-dir/
          remote: /home/kbuser/kb-dest/
          host: localhost
          port: "2222"
          username: kbuser
          password: kbpassword
          tryKeyboard: true
          verbose: true

      - name: Assert file was copied with tryKeyboard enabled
        run: |
          echo "Checking remote destination..."
          ls -la /home/kbuser/kb-dest/
          if [ ! -f "/home/kbuser/kb-dest/kbtest.txt" ]; then
            echo "FAIL: kbtest.txt not found in remote destination"
            exit 1
          fi
          CONTENT=$(cat /home/kbuser/kb-dest/kbtest.txt)
          echo "Content: $CONTENT"
          if [ "$CONTENT" != "keyboard interactive test content" ]; then
            echo "FAIL: file content does not match expected value"
            exit 1
          fi
          echo "PASS: file copied successfully with tryKeyboard enabled"
