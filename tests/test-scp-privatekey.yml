name: Test SCP with private key authentication
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up local SSH server and key-based auth
        run: |
          sudo apt-get install -y openssh-server
          sudo mkdir -p /var/run/sshd
          # Create test user
          sudo useradd -m -s /bin/bash keyuser
          # Generate encrypted SSH key pair with passphrase
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "mykeypassphrase" -C "test-key"
          # Set up authorized_keys for keyuser
          sudo mkdir -p /home/keyuser/.ssh
          sudo cp /tmp/test_key.pub /home/keyuser/.ssh/authorized_keys
          sudo chown -R keyuser:keyuser /home/keyuser/.ssh
          sudo chmod 700 /home/keyuser/.ssh
          sudo chmod 600 /home/keyuser/.ssh/authorized_keys
          # Allow public key authentication
          sudo sed -i 's/#PubkeyAuthentication yes/PubkeyAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#AuthorizedKeysFile/AuthorizedKeysFile/' /etc/ssh/sshd_config
          # Start SSH server
          sudo /usr/sbin/sshd -D &
          sleep 2
          # Create remote target directory
          sudo mkdir -p /home/keyuser/remote-target
          sudo chown keyuser:keyuser /home/keyuser/remote-target
          # Create local source directory
          mkdir -p /tmp/local-source-key
          echo "hello from key-based scp test" > /tmp/local-source-key/keytest.txt

      - name: Add localhost to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 localhost >> ~/.ssh/known_hosts

      - name: Read private key
        id: read-key
        run: |
          PRIVATE_KEY=$(cat /tmp/test_key)
          echo "private_key<<EOF" >> $GITHUB_OUTPUT
          echo "$PRIVATE_KEY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - id: action
        uses: .
        with:
          local: /tmp/local-source-key/
          remote: /home/keyuser/remote-target/
          host: localhost
          port: "22"
          username: keyuser
          privateKey: ${{ steps.read-key.outputs.private_key }}
          passphrase: mykeypassphrase
          rmRemote: false
          tryKeyboard: false
          verbose: true
          recursive: true
          concurrency: 2
          atomicPut: false

      - name: Assert files were copied
        run: |
          if [ ! -f /home/keyuser/remote-target/keytest.txt ]; then
            echo "FAIL: keytest.txt was not copied to remote target"
            exit 1
          fi
          CONTENT=$(cat /home/keyuser/remote-target/keytest.txt)
          echo "actual content: $CONTENT"
          if [ "$CONTENT" != "hello from key-based scp test" ]; then
            echo "FAIL: file content does not match"
            exit 1
          fi
          echo "PASS: files were copied successfully with key-based auth"
